name: "💡 Feature Request"
description: "Suggest a new feature or improvement"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. A clear use case helps us evaluate its value and scope.

  - type: textarea
    id: use-case
    attributes:
      label: "What are you trying to accomplish?"
      description: "Describe the task, limitation, or unmet need. You do not need to propose a solution."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: "What would you like Lyrical Sync to do?"
      description: "Describe a possible solution or behavior, if you have one. This is optional."
    validations:
      required: false

  - type: textarea
    id: impact
    attributes:
      label: "Who would benefit, and how often?"
      description: "For example, describe whether this affects your regular workflow or a specific use case."
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: "Additional Context"
      description: "Add reference images, examples, or other details that help explain the use case."
    validations:
      required: false
