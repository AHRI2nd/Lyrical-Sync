name: "🐛 Bug Report"
description: "Report a problem with Lyrical Sync"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. The details below help us investigate and reproduce the problem.

  - type: dropdown
    id: channel
    attributes:
      label: "Where did you get the app?"
      description: "Select the store or download source used to install this copy."
      options:
        - "GitHub Releases (direct download)"
        - "Mac App Store"
        - "Microsoft Store"
        - "Not sure"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: "App Version"
      description: "Find this in the app's About screen. Leave blank if you cannot find it."
      placeholder: "e.g., 0.7.0"
    validations:
      required: false

  - type: dropdown
    id: platform
    attributes:
      label: "Platform and Architecture"
      description: "Choose the app build you installed. On Windows ARM devices, choose the architecture of the installed app."
      options:
        - "macOS (Apple silicon / ARM64)"
        - "Windows x64 (Intel/AMD, including x64 emulation)"
        - "Windows ARM64"
        - "Other or not sure"
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: "Operating System Version"
      description: "Include the release or build number if available."
      placeholder: "e.g., macOS 15.1 or Windows 11 24H2"
    validations:
      required: false

  - type: textarea
    id: repro
    attributes:
      label: "Steps to Reproduce"
      description: "List the steps in order. If the problem is intermittent or you cannot reproduce it again, describe what happened and what you tried."
      placeholder: |
        1.
        2.
        3.
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
    validations:
      required: false

  - type: textarea
    id: actual
    attributes:
      label: "Actual Behavior"
    validations:
      required: false

  - type: input
    id: audio-format
    attributes:
      label: "Relevant Audio or Lyrics File Formats (if applicable)"
      placeholder: "e.g., MP3, FLAC, AIFF, LRC, or SRT"
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: "Additional Context"
      description: "Attach screenshots or relevant error messages. Review logs for personal information before sharing them."
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: "Checklist"
      options:
        - label: "I searched existing issues and did not find a duplicate."
          required: true
