name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      signed_candidate:
        description: Build signed qualification artifacts without publishing a release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  signed-candidate:
    if: ${{ inputs.signed_candidate == true }}
    uses: ./.github/workflows/candidate.yml
    secrets: inherit

  build:
    if: ${{ inputs.signed_candidate != true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundleArgs: ""
            label: macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundleArgs: ""
            label: windows-x64
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundleArgs: "--bundles nsis"
            label: windows-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Add cargo to PATH
        shell: bash
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Rust cache
        uses: swatinem/rust-cache@702e7a9c5a1b5c5d7e8f9a0b1c2d3e4f5a6b7c8d
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install frontend deps
        run: npm ci

      - name: Build
        uses: tauri-apps/tauri-action@b23f6d0b1e2d6c5e8b4a1f7e2d6a3b1c8e9f0d2e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }} ${{ matrix.bundleArgs }} -- --locked

      - name: Verify Windows artifact architecture
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          ARCH=x64
          if [ "${{ matrix.target }}" = "aarch64-pc-windows-msvc" ]; then ARCH=arm64; fi
          python scripts/verify_windows_build.py --architecture "$ARCH" --version "$VERSION" --binary "src-tauri/target/${{ matrix.target }}/release/lyrical-sync.exe" --installer-dir "src-tauri/target/${{ matrix.target }}/release/bundle/nsis"

      - name: Upload artifacts (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@65c4b4a1c4ae488b0c85c66f7ca88c5c5b46d1b0
        with:
          name: lyrical-sync-${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
          if-no-files-found: warn

      - name: Upload artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@65c4b4a1c4ae488b0c85c66f7ca88c5c5b46d1b0
        with:
          name: lyrical-sync-${{ matrix.label }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
          if-no-files-found: warn
