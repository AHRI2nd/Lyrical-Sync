name: Build

on:
  push:
    branches: [store-lite]
  workflow_dispatch:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}-store
      - name: Install dependencies
        run: npm ci
      - name: Test frontend
        run: npm test
      - name: Test license notice integrity
        run: node --test scripts/notices.node-test.mjs
      - name: Test MSIX staging
        run: node --test scripts/msix-stage.node-test.mjs
      - name: Test App Store profile validation
        if: runner.os == 'macOS'
        run: node --test scripts/appstore-preflight.node-test.mjs
      - name: Build unsigned macOS app
        if: runner.os == 'macOS'
        run: bash scripts/appstore-build.sh --unsigned
      - name: Compile Windows Store executable
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/msstore-build.ps1 -CompileOnly
      - uses: actions/upload-artifact@v4
        with:
          name: lyrical-sync-store-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
            src-tauri/target/${{ matrix.target }}/release/lyrical-sync.exe
          if-no-files-found: error
