name: Release

# 서명·공증 시크릿은 버전 태그(vX.Y.Z) 푸시에서만 접근 가능하도록 트리거를 좁힘.
# main 브랜치의 일반 빌드는 build.yml(서명 없음)이 담당.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundleArgs: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundleArgs: ""
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundleArgs: "--bundles nsis"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # 태그 푸시로 실행된 경우 tauri.conf.json의 버전과 태그가 어긋나면 즉시 실패시킨다.
      # (병합 전 커밋에서 실수로 실행돼 버전이 안 맞는 드래프트가 조용히 만들어지는 사고 방지)
      - name: Verify tag matches app version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -e
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          TAG_NAME="${{ github.ref_name }}"
          if [ "v${VERSION}" != "$TAG_NAME" ]; then
            echo "::error::Tag ${TAG_NAME} does not match tauri.conf.json version (v${VERSION}). Refusing to build a mislabeled release."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Add cargo to PATH
        shell: bash
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install frontend deps
        run: npm ci

      # macOS 전용: App Store Connect API Key(.p8 내용)를 파일로 기록.
      # APPLE_API_KEY 시크릿에는 .p8 파일 내용 전체가, APPLE_API_KEY_ID 시크릿에는
      # 실제 Key ID가 들어 있음(Tauri가 기대하는 이름과 반대이므로 아래에서 재매핑).
      - name: Write Apple API key file
        if: runner.os == 'macOS'
        shell: bash
        run: echo "${{ secrets.APPLE_API_KEY }}" > "${{ runner.temp }}/apple_api_key.p8"

      # 동봉된 mediaremote-adapter/MediaRemoteAdapter.framework(단일 바이너리 — perl 스크립트가
      # Versions/ 심볼릭 링크 구조 없이 이 파일을 직접 dlopen하므로 macOS 프레임워크 번들 관례를
      # 따를 필요가 없다)는 로컬에서 ad-hoc 서명된 채로 커밋돼 있어, Tauri 번들러가 만드는 .app
      # 서명이 이 중첩 리소스까지 재서명해주지 않으면 공증(notarization)이 "서명 안 된 바이너리"로
      # 거부된다. tauri-action이 앱을 빌드하기 전에 우리 Developer ID로 미리 서명해둔다.
      - name: Import Apple certificate
        if: runner.os == 'macOS'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Sign bundled mediaremote-adapter binary
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          BIN="src-tauri/resources/mediaremote-adapter/MediaRemoteAdapter.framework/MediaRemoteAdapter"
          codesign --force --sign "${{ secrets.APPLE_SIGNING_IDENTITY }}" --options runtime --timestamp "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"

      - name: Build signed macOS bundle
        if: runner.os == 'macOS'
        uses: tauri-apps/tauri-action@v0.5
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/apple_api_key.p8
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          includeUpdaterJson: false
          args: --target ${{ matrix.target }} ${{ matrix.bundleArgs }} --config src-tauri/tauri.updater.conf.json -- --locked

      - name: Build signed Windows bundle
        if: runner.os == 'Windows'
        uses: tauri-apps/tauri-action@v0.5.24
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          includeUpdaterJson: false
          args: --target ${{ matrix.target }} ${{ matrix.bundleArgs }} --config src-tauri/tauri.updater.conf.json -- --locked
      - name: Verify Windows artifact architecture
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          ARCH=x64
          if [ "${{ matrix.target }}" = "aarch64-pc-windows-msvc" ]; then ARCH=arm64; fi
          python scripts/verify_windows_build.py --architecture "$ARCH" --version "$VERSION" --binary "src-tauri/target/${{ matrix.target }}/release/lyrical-sync.exe" --installer-dir "src-tauri/target/${{ matrix.target }}/release/bundle/nsis"

      - name: Record exact source and signed candidate hashes
        shell: bash
        run: python scripts/record_signed_candidate.py --target "${{ matrix.target }}"

      - name: Upload verified build artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/
          if-no-files-found: error


  publish-release:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: signed-release-*
          path: release-artifacts
      - name: Verify matrix artifacts and publish draft assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')
          TAG="v${VERSION}"
          python scripts/verify_release_candidates.py --root release-artifacts --version "$VERSION" --source-sha "$SOURCE_SHA" --output "$RUNNER_TEMP/release-files.json"

          draft_ids=$(gh api --paginate "repos/${RELEASE_REPO}/releases?per_page=100" --jq ".[] | select(.tag_name == \"$TAG\" and .draft == true) | .id")
          published_ids=$(gh api --paginate "repos/${RELEASE_REPO}/releases?per_page=100" --jq ".[] | select(.tag_name == \"$TAG\" and .draft == false) | .id")
          draft_count=$(printf '%s\n' "$draft_ids" | awk 'NF { count++ } END { print count+0 }')
          published_count=$(printf '%s\n' "$published_ids" | awk 'NF { count++ } END { print count+0 }')
          if [ "$draft_count" -gt 1 ] || [ "$published_count" -gt 0 ]; then
            echo "::error::Release tag $TAG is ambiguous or already published; refusing to upload candidate artifacts."
            exit 1
          fi
          if [ "$draft_count" -eq 0 ]; then
            gh release create "$TAG" --target "$SOURCE_SHA" --draft --title "Lyrical Sync ${TAG#v}" --notes ""
          fi

          mapfile -t files < <(python -c 'import json,sys; print("\n".join(json.load(open(sys.argv[1]))["files"]))' "$RUNNER_TEMP/release-files.json")
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No verified release files were produced."
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --repo "$RELEASE_REPO" --clobber

  updater-manifest:
    needs: publish-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify updater architecture contract
        run: python scripts/test_release_manifest.py
      - name: Assemble complete updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          VERSION=$(python -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')
          python scripts/assemble_updater.py --repo "$RELEASE_REPO" --version "$VERSION"
