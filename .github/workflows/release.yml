name: Release

# 서명·공증 시크릿은 버전 태그(vX.Y.Z) 푸시에서만 접근 가능하도록 트리거를 좁힘.
# main 브랜치의 일반 빌드는 build.yml(서명 없음)이 담당.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag matching the app version (vX.Y.Z)'
        required: true
        default: ''
      create_tag:
        description: 'Create or retarget the draft tag to the selected main commit'
        type: boolean
        required: true
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release-preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify selected release tag and commit
        env:
          RELEASE_INPUT_TAG: ${{ github.event.inputs.tag }}
          RELEASE_CREATE_TAG: ${{ inputs.create_tag }}
        run: python3 scripts/release_preflight.py

  release:
    # Never expose signing credentials before verifying the exact checkout.
    needs: [release-preflight, test-gate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundleArgs: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundleArgs: "--bundles nsis,msi"
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundleArgs: "--bundles nsis"


    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # 태그 푸시로 실행된 경우 tauri.conf.json의 버전과 태그가 어긋나면 즉시 실패시킨다.
      # workflow_dispatch 실행 시에도 tag 입력이 반드시 태그 형식이어야 함.
      - name: Verify tag matches app version
        shell: bash
        env:
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_INPUT_TAG: ${{ github.event.inputs.tag }}
          RELEASE_CREATE_TAG: ${{ inputs.create_tag }}
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          TAG_NAME="$RELEASE_REF_NAME"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$GITHUB_REF_TYPE" = "branch" ] && [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$RELEASE_CREATE_TAG" = "true" ]; then
            TAG_NAME="$RELEASE_INPUT_TAG"
          fi
          # A manually supplied tag must be the ref actually checked out.
          # Never sign the selected branch while labeling it with another tag.
          if [ "$GITHUB_REF_TYPE" != "tag" ] && ! { [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$RELEASE_CREATE_TAG" = "true" ]; }; then
            echo "::error::Select an existing tag, or select main and enable create_tag."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$RELEASE_INPUT_TAG" != "$TAG_NAME" ]; then
            echo "::error::The entered release tag must match the selected tag ref."
            exit 1
          fi
          # 태그 형식이어야 함 (v로 시작, 숫자.숫자.숫자)
          if ! echo "$TAG_NAME" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Invalid tag format. Expected vMAJOR.MINOR.PATCH."
            exit 1
          fi
          if [ "v${VERSION}" != "$TAG_NAME" ]; then
            echo "::error::Tag $TAG_NAME does not match tauri.conf.json version (v${VERSION}). Refusing to build a mislabeled release."
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "::error::Checkout does not match the source commit being signed"
            exit 1
          fi
          echo "Tag version verified: $TAG_NAME"

      # Security: reject malicious ref text (command injection, path traversal)
      - name: Validate ref name for malicious patterns
        shell: bash
        env:
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -e
          REF_NAME="$RELEASE_REF_NAME"
          # workflow_dispatch의 경우 입력된 tag 사용
          if [ -n "$RELEASE_INPUT_TAG" ]; then
            REF_NAME="$RELEASE_INPUT_TAG"
          fi
          # Reject shell metacharacters: $, `, ;, |, &, >, <, (, ), {, }
          case "$REF_NAME" in
            *[\\$\`\;\|\&\>\<\(\)\{\}]*)
              echo "::error::Tag name contains shell metacharacters"
              exit 1
              ;;
          esac
          # Reject directory traversal patterns
          case "$REF_NAME" in
            *..*|*~*)
              echo "::error::Tag name contains path traversal pattern"
              exit 1
              ;;
          esac
          echo "Tag name validation passed"

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      # Setup Rust
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pinned commit
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Add cargo to PATH
        shell: bash
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Rust cache
        uses: swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install frontend deps
        run: npm ci

      # macOS 전용: App Store Connect API Key(.p8 내용)를 파일로 기록.
      - name: Write Apple API key file
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY }}
        run: |
          umask 077
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple_api_key.p8"

      # 동봉된 mediaremote-adapter 바이너리 서명
      - name: Import Apple certificate
        if: runner.os == 'macOS'
        uses: apple-actions/import-codesign-certs@63fff01cd422d4b7b855d40ca1e9d34d2de9427d # v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Sign bundled mediaremote-adapter binary
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -e
          BIN="src-tauri/resources/mediaremote-adapter/MediaRemoteAdapter.framework/MediaRemoteAdapter"
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" --options runtime --timestamp "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"

      # Build signed macOS bundle
      - name: Build signed macOS bundle
        if: runner.os == 'macOS'
        uses: tauri-apps/tauri-action@42e9df6c59070d114bf90dcd3943a1b8f138b113 # v0.5.20
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/apple_api_key.p8
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          includeUpdaterJson: false
          args: --target ${{ matrix.target }} ${{ matrix.bundleArgs }} --config src-tauri/tauri.updater.conf.json -- --locked

      # Build signed Windows bundle
      - name: Build signed Windows bundle
        if: runner.os == 'Windows'
        uses: tauri-apps/tauri-action@42e9df6c59070d114bf90dcd3943a1b8f138b113 # v0.5.20
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          includeUpdaterJson: false
          args: --target ${{ matrix.target }} ${{ matrix.bundleArgs }} --config src-tauri/tauri.updater.conf.json -- --locked

      # Verify Windows artifact architecture
      - name: Verify Windows artifact architecture
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          ARCH=x64
          if [ "${{ matrix.target }}" = "aarch64-pc-windows-msvc" ]; then ARCH=arm64; fi
          python scripts/verify_windows_build.py --architecture "$ARCH" --version "$VERSION" --binary "src-tauri/target/${{ matrix.target }}/release/lyrical-sync.exe" --installer-dir "src-tauri/target/${{ matrix.target }}/release/bundle/nsis"

      # Record exact source and signed candidate hashes
      - name: Record exact source and signed candidate hashes
        shell: bash
        run: python scripts/record_signed_candidate.py --target "${{ matrix.target }}"

      - name: Select exact candidate files for provenance
        id: provenance-subjects
        shell: bash
        run: |
          set -euo pipefail
          candidate="src-tauri/target/${{ matrix.target }}/release/bundle/candidate-record.json"
          {
            echo 'paths<<LYRICAL_SYNC_PATHS'
            jq -r '.installers[].path | "src-tauri/target/${{ matrix.target }}/release/bundle/" + .' "$candidate"
            echo 'LYRICAL_SYNC_PATHS'
          } >> "$GITHUB_OUTPUT"

      - name: Attest signed candidate files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.provenance-subjects.outputs.paths }}

      # Upload verified build artifact
      - name: Upload verified build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-release-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/
          if-no-files-found: error

  # Run the same full macOS/Windows x64/Windows ARM64 checks as pull requests.
  # Signing jobs receive no secrets until this exact-source matrix passes.
  test-gate:
    needs: release-preflight
    uses: ./.github/workflows/test.yml

  publish-release:
    needs: [release, test-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: signed-release-*
          path: release-artifacts
      - name: Verify matrix artifacts and publish draft assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_CREATE_TAG: ${{ inputs.create_tag }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')
          TAG="v${VERSION}"
          python scripts/verify_release_candidates.py --root release-artifacts --version "$VERSION" --source-sha "$SOURCE_SHA" --output "$RUNNER_TEMP/release-files.json"

          # Verify provenance before any release tag or draft mutation.
          mapfile -t candidate_files < <(python -c 'import json,sys; print("\n".join(json.load(open(sys.argv[1]))["files"]))' "$RUNNER_TEMP/release-files.json")
          for candidate in "${candidate_files[@]}"; do
            case "$candidate" in
              *.sig) continue ;;
            esac
            gh attestation verify "$candidate" \
              --repo "$RELEASE_REPO" \
              --signer-workflow "$RELEASE_REPO/.github/workflows/release.yml" \
              --source-digest "$SOURCE_SHA"
          done

          draft_ids=$(gh api --paginate "repos/${RELEASE_REPO}/releases?per_page=100" --jq ".[] | select(.tag_name == \"$TAG\" and .draft == true) | .id")
          published_ids=$(gh api --paginate "repos/${RELEASE_REPO}/releases?per_page=100" --jq ".[] | select(.tag_name == \"$TAG\" and .draft == false) | .id")
          draft_count=$(printf '%s\n' "$draft_ids" | awk 'NF { count++ } END { print count+0 }')
          published_count=$(printf '%s\n' "$published_ids" | awk 'NF { count++ } END { print count+0 }')
          if [ "$draft_count" -gt 1 ] || [ "$published_count" -gt 0 ]; then
            echo "::error::Release tag $TAG is ambiguous or already published; refusing to upload candidate artifacts."
            exit 1
          fi
          can_retarget="false"
          if [ "$RELEASE_EVENT" = "workflow_dispatch" ] && [ "$RELEASE_REF" = "refs/heads/main" ] && [ "$RELEASE_CREATE_TAG" = "true" ]; then
            can_retarget="true"
          fi

          # A draft is refreshed from the selected main commit only when tag creation/retargeting was explicitly selected.
          if [ "$draft_count" -eq 1 ]; then
            existing_target=$(gh api "repos/${RELEASE_REPO}/releases/${draft_ids}" --jq '.target_commitish')
            if [ "$existing_target" != "$SOURCE_SHA" ]; then
              if [ "$can_retarget" != "true" ]; then
                echo "::error::Existing draft targets $existing_target, expected $SOURCE_SHA. Select main and enable create_tag to refresh this draft."
                exit 1
              fi
              gh api --method DELETE "repos/${RELEASE_REPO}/releases/${draft_ids}" >/dev/null
              draft_count=0
            fi
          fi

          tag_exists="true"
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            tag_exists="false"
            if [ "$RELEASE_EVENT" != "workflow_dispatch" ] || [ "$RELEASE_REF" != "refs/heads/main" ] || [ "$RELEASE_CREATE_TAG" != "true" ]; then
              echo "::error::Release tag does not exist and tag creation was not selected."
              exit 1
            fi
            gh api --method POST "repos/${RELEASE_REPO}/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$SOURCE_SHA" >/dev/null
          fi
          git fetch --depth=1 origin "refs/tags/$TAG"
          resolved_tag_sha=$(git rev-parse "FETCH_HEAD^{commit}")
          if [ "$resolved_tag_sha" != "$SOURCE_SHA" ]; then
            if [ "$can_retarget" != "true" ]; then
              echo "::error::Current remote tag points to $resolved_tag_sha, expected $SOURCE_SHA. Select main and enable create_tag to refresh this draft tag."
              exit 1
            fi
            if [ "$tag_exists" = "true" ]; then
              gh api --method PATCH "repos/${RELEASE_REPO}/git/refs/tags/$TAG" -f "sha=$SOURCE_SHA" -F force=true >/dev/null
            fi
            git fetch --depth=1 origin "refs/tags/$TAG"
            resolved_tag_sha=$(git rev-parse "FETCH_HEAD^{commit}")
            if [ "$resolved_tag_sha" != "$SOURCE_SHA" ]; then
              echo "::error::Refreshed release tag points to $resolved_tag_sha, expected $SOURCE_SHA"
              exit 1
            fi
          fi
          if [ "$draft_count" -eq 0 ]; then
            gh release create "$TAG" --target "$SOURCE_SHA" --draft --title "Lyrical Sync ${TAG#v}" --notes ""
          fi

          mapfile -t files < <(python -c 'import json,sys; print("\n".join(json.load(open(sys.argv[1]))["files"]))' "$RUNNER_TEMP/release-files.json")
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No verified release files were produced."
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --repo "$RELEASE_REPO"

  updater-manifest:
    needs: publish-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify updater architecture contract
        run: python scripts/test_release_manifest.py
      - name: Assemble complete updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          VERSION=$(python -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')
          python scripts/assemble_updater.py --repo "$RELEASE_REPO" --version "$VERSION"

      - name: Verify provenance of final release installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')
          TAG="v${VERSION}"
          download_dir="$RUNNER_TEMP/final-release-assets"
          mkdir -p "$download_dir"
          gh release download "$TAG" --repo "$RELEASE_REPO" --dir "$download_dir"
          mapfile -t installers < <(find "$download_dir" -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' -o -name '*.app.tar.gz' \) | sort)
          if [ "${#installers[@]}" -ne 5 ]; then
            echo "::error::Expected five final installer/archive assets, found ${#installers[@]}"
            exit 1
          fi
          for installer in "${installers[@]}"; do
            gh attestation verify "$installer" \
              --repo "$RELEASE_REPO" \
              --signer-workflow "$RELEASE_REPO/.github/workflows/release.yml" \
              --source-digest "$SOURCE_SHA"
          done
