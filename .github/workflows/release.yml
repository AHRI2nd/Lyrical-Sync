name: App Store Release

# Mac App Store 제출 빌드. dev-next/main의 Developer ID 직접배포 파이프라인과는
# 완전히 별개 — 여기서는 Apple Distribution 인증서로 서명하고 .pkg로 패키징해
# App Store Connect에 업로드합니다(공증/notarization 불필요 — Apple 심사가 대체).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Add cargo to PATH
        shell: bash
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: aarch64-apple-darwin

      - name: Install frontend deps
        run: npm ci

      # Apple Distribution(앱 서명용) + 3rd Party Mac Developer Installer(pkg 서명용)
      # 두 인증서를 같은 임시 키체인에 임포트. 둘 다 .p12로 내보내 base64 인코딩해
      # 시크릿에 저장(예: `base64 -i cert.p12 | pbcopy`). 액션 대신 security CLI를
      # 직접 써서 두 인증서가 확실히 같은 키체인에 들어가도록 함.
      - name: Import signing certificates
        shell: bash
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/appstore-signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # productbuild --sign은 codesign과 달리 search list 전체가 아니라
          # default keychain을 우선 참조함 — 지정 안 하면 인증서를 못 찾고
          # GUI 프롬프트를 기다리며 무한 대기(headless CI에서 영영 안 끝남).
          security default-keychain -s "$KEYCHAIN_PATH"

          # Apple 중간 인증서(WWDR CA) 체인이 없으면 productbuild가 신뢰 체인을
          # 완성 못 해 같은 방식으로 무한 대기함(codesign은 이 문제를 덜 타서
          # 먼저 성공해버려 원인 파악이 헷갈림). 어느 세대(G3~G6)가 필요한지
          # 몰라도 되게 전부 받아서 임포트.
          for gen in G3 G4 G5 G6; do
            curl -fsSL "https://www.apple.com/certificateauthority/AppleWWDRCA${gen}.cer" \
              -o "$RUNNER_TEMP/AppleWWDRCA${gen}.cer"
            security import "$RUNNER_TEMP/AppleWWDRCA${gen}.cer" -k "$KEYCHAIN_PATH"
          done

          echo "${{ secrets.APPLE_DISTRIBUTION_P12 }}" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          echo "${{ secrets.APPLE_INSTALLER_P12 }}" | base64 --decode > "$RUNNER_TEMP/installer.p12"

          security import "$RUNNER_TEMP/distribution.p12" -k "$KEYCHAIN_PATH" \
            -P "${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}" -T /usr/bin/codesign
          security import "$RUNNER_TEMP/installer.p12" -k "$KEYCHAIN_PATH" \
            -P "${{ secrets.APPLE_INSTALLER_P12_PASSWORD }}" \
            -T /usr/bin/productbuild -T /usr/bin/productsign

          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild:,productsign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/installer.p12"

      # App Store Connect에서 등록한 Mac App Store Provisioning Profile.
      # `security cms -D -i profile.provisionprofile` 로 App Sandbox 등 엔타이틀먼트가
      # 일치하는지 사전에 로컬에서 확인해두는 걸 권장.
      - name: Install provisioning profile
        shell: bash
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > \
            "$HOME/Library/MobileDevice/Provisioning Profiles/lyrical-sync.provisionprofile"

      - name: Verify tag matches app version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CONF_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$TAG_VERSION" != "$CONF_VERSION" ]; then
            echo "::error::태그(v$TAG_VERSION)와 tauri.conf.json의 version($CONF_VERSION)이 다릅니다."
            exit 1
          fi
        if: github.event_name == 'push'

      - name: Build unsigned app bundle
        run: npx tauri build --bundles app --target aarch64-apple-darwin

      - name: Embed provisioning profile
        shell: bash
        run: |
          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Lyrical Sync.app"
          cp "$HOME/Library/MobileDevice/Provisioning Profiles/lyrical-sync.provisionprofile" \
            "$APP/Contents/embedded.provisionprofile"

      # tauri build 자체는 서명 아이덴티티를 넘기지 않으면 ad-hoc 서명만 하고
      # entitlements를 코드사인에 포함하지 않으므로, 여기서 별도로 재서명한다.
      - name: Codesign with entitlements
        shell: bash
        run: |
          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Lyrical Sync.app"
          codesign --force --deep --options runtime \
            --entitlements src-tauri/entitlements.plist \
            -s "${{ secrets.APPLE_DISTRIBUTION_IDENTITY }}" \
            "$APP"
          codesign --verify --deep --strict "$APP"
          codesign -d --entitlements - "$APP"

      - name: Build .pkg installer
        shell: bash
        run: |
          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Lyrical Sync.app"
          # lsof로 확인한 결과 productbuild가 신뢰 타임스탬프 서버(RFC3161) 접속을 시도하며
          # 걸려있었음(기본 동작, man productbuild 참고). GitHub 러너에서 그 특정 엔드포인트
          # 응답이 없어 무한 대기 → 애초에 네트워크를 안 타도록 타임스탬프를 끔.
          # App Store Connect 업로드 자체는 별도 검증을 거치므로 pkg 자체 타임스탬프는 불필요.
          productbuild --component "$APP" /Applications \
            --sign "${{ secrets.APPLE_INSTALLER_IDENTITY }}" \
            --timestamp=none \
            "Lyrical Sync.pkg" &
          PB_PID=$!

          # 만약을 대비해 타임아웃 진단 래퍼는 유지 — 다른 원인 무한
          # 대기가 재현됨 — 추측 대신 60초 내로 안 끝나면 스택 샘플을 찍어서 정확히
          # 뭘 기다리는지(네트워크? SecurityAgent UI? 다른 프로세스?) 확인하고 실패시킴.
          for i in $(seq 1 60); do
            if ! kill -0 "$PB_PID" 2>/dev/null; then
              wait "$PB_PID"
              exit $?
            fi
            sleep 1
          done

          echo "::error::productbuild이 60초 내로 끝나지 않음 — 스택 샘플 채취"
          sample "$PB_PID" 5 -file "$RUNNER_TEMP/productbuild-sample.txt" || true
          cat "$RUNNER_TEMP/productbuild-sample.txt" || true
          echo "=== lsof (열려 있는 파일/소켓) ==="
          lsof -p "$PB_PID" || true
          kill -9 "$PB_PID" 2>/dev/null || true
          exit 1

      - name: Write App Store Connect API key file
        shell: bash
        run: echo "${{ secrets.APPLE_API_KEY }}" > "${{ runner.temp }}/apple_api_key.p8"

      # App Store 업로드는 공증(notarytool) 대상이 아님 — altool의 --upload-app으로
      # App Store Connect에 직접 업로드하면 Apple 심사팀이 그 빌드를 검토.
      - name: Upload to App Store Connect
        shell: bash
        run: |
          xcrun altool --upload-app \
            -f "Lyrical Sync.pkg" \
            -t macos \
            --apiKey "${{ secrets.APPLE_API_KEY_ID }}" \
            --apiIssuer "${{ secrets.APPLE_API_ISSUER }}" \
            --apiKeyPath "${{ runner.temp }}/apple_api_key.p8"
