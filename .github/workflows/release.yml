name: Release

# 서명·공증 시크릿은 버전 태그(vX.Y.Z) 푸시에서만 접근 가능하도록 트리거를 좁힘.
# main 브랜치의 일반 빌드는 build.yml(서명 없음)이 담당.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (vX.Y.Z)'
        required: true
        default: ''

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    # Never expose signing credentials before verifying the exact checkout.
    needs: test-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundleArgs: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundleArgs: "--bundles nsis,msi"
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundleArgs: "--bundles nsis"


    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # 태그 푸시로 실행된 경우 tauri.conf.json의 버전과 태그가 어긋나면 즉시 실패시킨다.
      # workflow_dispatch 실행 시에도 tag 입력이 반드시 태그 형식이어야 함.
      - name: Verify tag matches app version
        shell: bash
        env:
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          TAG_NAME="$RELEASE_REF_NAME"
          # A manually supplied tag must be the ref actually checked out.
          # Never sign the selected branch while labeling it with another tag.
          if [ "$GITHUB_REF_TYPE" != "tag" ] ||
             { [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$RELEASE_INPUT_TAG" != "$TAG_NAME" ]; }; then
            echo "::error::Signed releases require a matching tag ref"
            exit 1
          fi
          # 태그 형식이어야 함 (v로 시작, 숫자.숫자.숫자)
          if ! echo "$TAG_NAME" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Invalid tag format: $TAG_NAME. Expected vMAJOR.MINOR.PATCH."
            exit 1
          fi
          if [ "v${VERSION}" != "$TAG_NAME" ]; then
            echo "::error::Tag $TAG_NAME does not match tauri.conf.json version (v${VERSION}). Refusing to build a mislabeled release."
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "::error::Checkout does not match the source commit being signed"
            exit 1
          fi
          echo "Tag version verified: $TAG_NAME"

      # Security: reject malicious ref text (command injection, path traversal)
      - name: Validate ref name for malicious patterns
        shell: bash
        env:
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -e
          REF_NAME="$RELEASE_REF_NAME"
          # workflow_dispatch의 경우 입력된 tag 사용
          if [ -n "$RELEASE_INPUT_TAG" ]; then
            REF_NAME="$RELEASE_INPUT_TAG"
          fi
          # Reject shell metacharacters: $, `, ;, |, &, >, <, (, ), {, }
          case "$REF_NAME" in
            *[\\$\`\;\|\&\>\<\(\)\{\}]*)
              echo "::error::Tag name contains shell metacharacters"
              exit 1
              ;;
          esac
          # Reject directory traversal patterns
          case "$REF_NAME" in
            *..*|*~*)
              echo "::error::Tag name contains path traversal pattern"
              exit 1
              ;;
          esac
          echo "Tag name validation passed"

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Setup Rust
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Add cargo to PATH
        shell: bash
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install frontend deps
        run: npm ci

      # macOS 전용: App Store Connect API Key(.p8 내용)를 파일로 기록.
      - name: Write Apple API key file
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY }}
        run: |
          umask 077
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple_api_key.p8"

      # 동봉된 mediaremote-adapter 바이너리 서명
      - name: Import Apple certificate
        if: runner.os == 'macOS'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Sign bundled mediaremote-adapter binary
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -e
          BIN="src-tauri/resources/mediaremote-adapter/MediaRemoteAdapter.framework/MediaRemoteAdapter"
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" --options runtime --timestamp "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"

      # Build signed macOS bundle
      - name: Build signed macOS bundle
        if: runner.os == 'macOS'
        uses: tauri-apps/tauri-action@v0.5
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/apple_api_key.p8
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          includeUpdaterJson: false
          args: --target ${{ matrix.target }} ${{ matrix.bundleArgs }} --config src-tauri/tauri.updater.conf.json -- --locked

      # Build signed Windows bundle
      - name: Build signed Windows bundle
        if: runner.os == 'Windows'
        uses: tauri-apps/tauri-action@v0.5
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          includeUpdaterJson: false
          args: --target ${{ matrix.target }} ${{ matrix.bundleArgs }} --config src-tauri/tauri.updater.conf.json -- --locked

      # Verify Windows artifact architecture
      - name: Verify Windows artifact architecture
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          ARCH=x64
          if [ "${{ matrix.target }}" = "aarch64-pc-windows-msvc" ]; then ARCH=arm64; fi
          python scripts/verify_windows_build.py --architecture "$ARCH" --version "$VERSION" --binary "src-tauri/target/${{ matrix.target }}/release/lyrical-sync.exe" --installer-dir "src-tauri/target/${{ matrix.target }}/release/bundle/nsis"

      # Record exact source and signed candidate hashes
      - name: Record exact source and signed candidate hashes
        shell: bash
        run: python scripts/record_signed_candidate.py --target "${{ matrix.target }}"

      # Upload verified build artifact
      - name: Upload verified build artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/
          if-no-files-found: error

  # Test gate: 실행 전 반드시 테스트가 통과해야 함
  test-gate:
    runs-on: ubuntu-latest
    needs: []
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Install Linux Tauri test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - name: Run frontend tests
        run: npm test
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --locked
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Python AI sidecars and signed candidate checks
        run: |
          python scripts/test_ai_sidecars.py
          python scripts/test_signed_candidate.py

  publish-release:
    needs: [release, test-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: signed-release-*
          path: release-artifacts
      - name: Verify matrix artifacts and publish draft assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')
          TAG="v${VERSION}"
          python scripts/verify_release_candidates.py --root release-artifacts --version "$VERSION" --source-sha "$SOURCE_SHA" --output "$RUNNER_TEMP/release-files.json"

          draft_ids=$(gh api --paginate "repos/${RELEASE_REPO}/releases?per_page=100" --jq ".[] | select(.tag_name == \"$TAG\" and .draft == true) | .id")
          published_ids=$(gh api --paginate "repos/${RELEASE_REPO}/releases?per_page=100" --jq ".[] | select(.tag_name == \"$TAG\" and .draft == false) | .id")
          draft_count=$(printf '%s\n' "$draft_ids" | awk 'NF { count++ } END { print count+0 }')
          published_count=$(printf '%s\n' "$published_ids" | awk 'NF { count++ } END { print count+0 }')
          if [ "$draft_count" -gt 1 ] || [ "$published_count" -gt 0 ]; then
            echo "::error::Release tag $TAG is ambiguous or already published; refusing to upload candidate artifacts."
            exit 1
          fi
          # A pre-existing draft must be bound to this exact tested commit.
          # Do not replace another source's assets with --clobber.
          if [ "$draft_count" -eq 1 ]; then
            existing_target=$(gh api "repos/${RELEASE_REPO}/releases/${draft_ids}" --jq '.target_commitish')
            if [ "$existing_target" != "$SOURCE_SHA" ]; then
              echo "::error::Existing draft targets $existing_target, expected $SOURCE_SHA"
              exit 1
            fi
          fi

          git fetch --depth=1 origin "refs/tags/$TAG"
          resolved_tag_sha=$(git rev-parse "FETCH_HEAD^{commit}")
          if [ "$resolved_tag_sha" != "$SOURCE_SHA" ]; then
            echo "::error::Current remote tag points to $resolved_tag_sha, expected $SOURCE_SHA"
            exit 1
          fi
          if [ "$draft_count" -eq 0 ]; then
            gh release create "$TAG" --target "$SOURCE_SHA" --draft --title "Lyrical Sync ${TAG#v}" --notes ""
          fi

          mapfile -t files < <(python -c 'import json,sys; print("\n".join(json.load(open(sys.argv[1]))["files"]))' "$RUNNER_TEMP/release-files.json")
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No verified release files were produced."
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --repo "$RELEASE_REPO" --clobber

  updater-manifest:
    needs: publish-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify updater architecture contract
        run: python scripts/test_release_manifest.py
      - name: Assemble complete updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          VERSION=$(python -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')
          python scripts/assemble_updater.py --repo "$RELEASE_REPO" --version "$VERSION"
