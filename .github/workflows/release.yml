name: Release

# 서명·공증 시크릿은 버전 태그(vX.Y.Z) 푸시에서만 접근 가능하도록 트리거를 좁힘.
# main 브랜치의 일반 빌드는 build.yml(서명 없음)이 담당.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # 태그 푸시로 실행된 경우 tauri.conf.json의 버전과 태그가 어긋나면 즉시 실패시킨다.
      # (병합 전 커밋에서 실수로 실행돼 버전이 안 맞는 드래프트가 조용히 만들어지는 사고 방지)
      - name: Verify tag matches app version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -e
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          TAG_NAME="${{ github.ref_name }}"
          if [ "v${VERSION}" != "$TAG_NAME" ]; then
            echo "::error::Tag ${TAG_NAME} does not match tauri.conf.json version (v${VERSION}). Refusing to build a mislabeled release."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Add cargo to PATH
        shell: bash
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install frontend deps
        run: npm ci

      # macOS 전용: App Store Connect API Key(.p8 내용)를 파일로 기록.
      # APPLE_API_KEY 시크릿에는 .p8 파일 내용 전체가, APPLE_API_KEY_ID 시크릿에는
      # 실제 Key ID가 들어 있음(Tauri가 기대하는 이름과 반대이므로 아래에서 재매핑).
      - name: Write Apple API key file
        if: runner.os == 'macOS'
        shell: bash
        run: echo "${{ secrets.APPLE_API_KEY }}" > "${{ runner.temp }}/apple_api_key.p8"

      # 동봉된 mediaremote-adapter/MediaRemoteAdapter.framework(단일 바이너리 — perl 스크립트가
      # Versions/ 심볼릭 링크 구조 없이 이 파일을 직접 dlopen하므로 macOS 프레임워크 번들 관례를
      # 따를 필요가 없다)는 로컬에서 ad-hoc 서명된 채로 커밋돼 있어, Tauri 번들러가 만드는 .app
      # 서명이 이 중첩 리소스까지 재서명해주지 않으면 공증(notarization)이 "서명 안 된 바이너리"로
      # 거부된다. tauri-action이 앱을 빌드하기 전에 우리 Developer ID로 미리 서명해둔다.
      - name: Import Apple certificate
        if: runner.os == 'macOS'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Sign bundled mediaremote-adapter binary
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          BIN="src-tauri/resources/mediaremote-adapter/MediaRemoteAdapter.framework/MediaRemoteAdapter"
          codesign --force --sign "${{ secrets.APPLE_SIGNING_IDENTITY }}" --options runtime --timestamp "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"

      - name: Build & release (macOS)
        if: runner.os == 'macOS'
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/apple_api_key.p8
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Lyrical Sync v__VERSION__'
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} --config src-tauri/tauri.updater.conf.json

      - name: Build & release (Windows)
        if: runner.os == 'Windows'
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Lyrical Sync v__VERSION__'
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} --config src-tauri/tauri.updater.conf.json

      # WiX(MSI)는 파일명 끝에 언어 코드(_en-US.msi)를 붙이는 옵션밖에 없어 Tauri 설정으로
      # 바꿀 수 없음. NSIS(_x64-setup.exe)와 명명을 맞추기 위해 업로드된 자산을 재명명.
      #
      # 주의: GitHub는 업로드 시 자산 파일명의 공백을 점(.)으로 치환한다. 로컬 디스크의
      # 파일명(공백 포함)을 그대로 삭제 대상 이름으로 쓰면 실제 자산명과 안 맞아 삭제가
      # 조용히 실패한다(예전에 이 문제로 _en-US.msi가 안 지워지고 남아있던 적 있음) — 반드시
      # 릴리스에 실제로 올라간 자산 목록에서 이름을 찾아 사용한다. latest.json도 옛 파일명을
      # 참조하므로 같이 갱신하지 않으면 업데이터가 삭제된 자산을 가리키게 된다.
      - name: Rename MSI asset (_en-US.msi -> _setup.msi)
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          REPO="${{ github.repository }}"
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          TAG="v${VERSION}"
          MSI_PATH=$(find src-tauri/target -type f -path "*/bundle/msi/*.msi" | head -1)
          if [ -z "$MSI_PATH" ]; then
            echo "MSI file not found, skipping rename"
            exit 0
          fi
          LOCAL_NAME=$(basename "$MSI_PATH")
          NEW_NAME=$(echo "$LOCAL_NAME" | sed -E 's/_[a-z]{2}-[A-Z]{2}\.msi$/_setup.msi/')
          if [ "$LOCAL_NAME" = "$NEW_NAME" ]; then
            echo "Filename already matches expected pattern, skipping"
            exit 0
          fi

          NEW_PATH="$(dirname "$MSI_PATH")/$NEW_NAME"
          cp "$MSI_PATH" "$NEW_PATH"
          gh release upload "$TAG" "$NEW_PATH" --repo "$REPO" --clobber

          # 실제 업로드된 옛 msi/.sig 자산명을 목록에서 찾아 삭제(추측 이름 사용 금지)
          OLD_ASSET_NAME=$(gh release view "$TAG" --repo "$REPO" --json assets \
            --jq '.assets[].name' | grep -F "_en-US.msi" | grep -v '\.sig$' || true)
          OLD_SIG_NAME=$(gh release view "$TAG" --repo "$REPO" --json assets \
            --jq '.assets[].name' | grep -F "_en-US.msi.sig" || true)

          if [ -n "$OLD_ASSET_NAME" ]; then
            gh release delete-asset "$TAG" "$OLD_ASSET_NAME" --repo "$REPO" --yes
          fi
          if [ -n "$OLD_SIG_NAME" ]; then
            gh release delete-asset "$TAG" "$OLD_SIG_NAME" --repo "$REPO" --yes
          fi

          # latest.json이 삭제된 옛 msi 파일명을 계속 참조하지 않도록 갱신
          if [ -n "$OLD_ASSET_NAME" ]; then
            gh release download "$TAG" --repo "$REPO" -p latest.json -O latest.json --clobber
            sed -i.bak "s|$OLD_ASSET_NAME|$NEW_NAME|g" latest.json
            gh release upload "$TAG" latest.json --repo "$REPO" --clobber
          fi
