name: Release

# 서명·공증 시크릿은 버전 태그(vX.Y.Z) 푸시에서만 접근 가능하도록 트리거를 좁힘.
# main 브랜치의 일반 빌드는 build.yml(서명 없음)이 담당.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Add cargo to PATH
        shell: bash
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install frontend deps
        run: npm ci

      # macOS 전용: App Store Connect API Key(.p8 내용)를 파일로 기록.
      # APPLE_API_KEY 시크릿에는 .p8 파일 내용 전체가, APPLE_API_KEY_ID 시크릿에는
      # 실제 Key ID가 들어 있음(Tauri가 기대하는 이름과 반대이므로 아래에서 재매핑).
      - name: Write Apple API key file
        if: runner.os == 'macOS'
        shell: bash
        run: echo "${{ secrets.APPLE_API_KEY }}" > "${{ runner.temp }}/apple_api_key.p8"

      # 동봉된 mediaremote-adapter/MediaRemoteAdapter.framework는 로컬에서 ad-hoc 서명된
      # 채로 커밋돼 있어, Tauri 번들러가 만드는 .app 서명이 이 중첩 리소스까지 재서명해주지
      # 않으면 공증(notarization)이 "서명 안 된 바이너리"로 거부된다. tauri-action이 앱을
      # 빌드하기 전에 우리 Developer ID로 미리 서명해둔다.
      - name: Import Apple certificate
        if: runner.os == 'macOS'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Sign bundled mediaremote-adapter framework
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          FW="src-tauri/resources/mediaremote-adapter/MediaRemoteAdapter.framework"
          codesign --force --sign "${{ secrets.APPLE_SIGNING_IDENTITY }}" --options runtime --timestamp "$FW"
          codesign --verify --deep --strict --verbose=2 "$FW"

      - name: Build & release (macOS)
        if: runner.os == 'macOS'
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/apple_api_key.p8
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Lyrical Sync v__VERSION__'
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} --config src-tauri/tauri.updater.conf.json

      - name: Build & release (Windows)
        if: runner.os == 'Windows'
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Lyrical Sync v__VERSION__'
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} --config src-tauri/tauri.updater.conf.json

      # WiX(MSI)는 파일명 끝에 언어 코드(_en-US.msi)를 붙이는 옵션밖에 없어 Tauri 설정으로
      # 바꿀 수 없음. NSIS(_x64-setup.exe)와 명명을 맞추기 위해 업로드된 자산을 재명명.
      - name: Rename MSI asset (_en-US.msi -> _setup.msi)
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          TAG="v${VERSION}"
          MSI_PATH=$(find src-tauri/target -type f -path "*/bundle/msi/*.msi" | head -1)
          if [ -z "$MSI_PATH" ]; then
            echo "MSI file not found, skipping rename"
            exit 0
          fi
          OLD_NAME=$(basename "$MSI_PATH")
          NEW_NAME=$(echo "$OLD_NAME" | sed -E 's/_[a-z]{2}-[A-Z]{2}\.msi$/_setup.msi/')
          NEW_PATH="$(dirname "$MSI_PATH")/$NEW_NAME"
          if [ "$OLD_NAME" = "$NEW_NAME" ]; then
            echo "Filename already matches expected pattern, skipping"
            exit 0
          fi
          cp "$MSI_PATH" "$NEW_PATH"
          gh release upload "$TAG" "$NEW_PATH" --repo "${{ github.repository }}" --clobber
          gh release delete-asset "$TAG" "$OLD_NAME" --repo "${{ github.repository }}" --yes || true
