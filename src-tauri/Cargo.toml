[package]
name = "lyrical-sync"
version = "0.6.0"
description = "LRC file creator and editor"
authors = []
edition = "2021"

[lib]
name = "lyrical_sync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", features = ["aiff", "pcm"] }
hound = "3"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json"] }
tokio = { version = "1", features = ["fs", "process", "io-util", "time", "rt"] }
sha2 = "0.10"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
lofty = "0.22"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Media_Control", "Foundation", "Foundation_Collections", "Win32_System_Com"] }
