[package]
name = "lyrical-sync"
version = "0.6.101"
description = "LRC file creator and editor"
authors = []
edition = "2021"

[lib]
name = "lyrical_sync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", features = ["aiff", "pcm"] }
hound = "3"
lofty = "0.22"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSURL", "NSData", "NSArray", "NSString", "NSError"] }
